plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dicomengine'
version = '0.1.0'

android {
  namespace "expo.modules.dicomengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }

  externalNativeBuild {
    cmake {
      path "../cpp/CMakeLists.txt"
    }
  }
}
